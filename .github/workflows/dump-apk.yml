name: Dump APK from RuStore

on:
  workflow_dispatch:
    inputs:
      device_id:
        description: 'deviceId, видящий нужную версию (пусто — опросить случайные)'
        required: false
      version:
        description: 'Ожидаемая версия; при более старой дамп прерывается'
        required: false
  repository_dispatch:
    types: [dump-apk]

permissions:
  contents: write   # создать релиз
  actions:  write   # дёрнуть parser.yml через workflow_dispatch

jobs:
  dump-and-release:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Install apk-mitm + fresh Apktool
        # apk-mitm 1.3.0 несёт в комплекте apktool 2.9.3, который падает на
        # свежих Material-атрибутах (state_dragged и т.п.) → patched.apk
        # молча не собирается. Подсовываем актуальный apktool через --apktool.
        run: |
          npm install -g apk-mitm
          APKTOOL_VER="3.0.2"
          curl -sL "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar" \
            -o /tmp/apktool.jar
          echo "APKTOOL_JAR=/tmp/apktool.jar" >> $GITHUB_ENV
          echo "Downloaded Apktool v${APKTOOL_VER} ($(wc -c < /tmp/apktool.jar) bytes)"
      
      - name: Download APK
        id: download
        env:
          # Бот присылает deviceId, который увидел новую версию, и саму версию.
          # Без deviceId дампер сгенерирует свой и во время частичной раскатки
          # может не попасть в ту же группу — тогда скачается предыдущая сборка.
          DEVICE_ID:      ${{ github.event.client_payload.device_id || github.event.inputs.device_id }}
          EXPECT_VERSION: ${{ github.event.client_payload.version || github.event.inputs.version }}
        run: |
          PACKAGE="ru.oneme.app"

          ARGS=()
          if [ -n "$DEVICE_ID" ]; then
            echo "Использую deviceId от бота: $DEVICE_ID"
            ARGS+=(--device-id "$DEVICE_ID")
          else
            echo "deviceId не передан (ручной запуск) — опрашиваю случайные"
          fi
          if [ -n "$EXPECT_VERSION" ]; then
            ARGS+=(--expect-version "$EXPECT_VERSION")
          fi

          python dumper.py "$PACKAGE" "${ARGS[@]}"

          APP_INFO=$(cat app_info.json)
          
          APK_FILE=$(ls *.apk | head -n 1)
          echo "file=$APK_FILE" >> $GITHUB_OUTPUT
          
          echo "package=$PACKAGE" >> $GITHUB_OUTPUT
          echo "version=$(echo $APP_INFO | jq -r '.version_name')" >> $GITHUB_OUTPUT
          echo "version_code=$(echo $APP_INFO | jq -r '.version_code')" >> $GITHUB_OUTPUT
          echo "min_sdk=$(echo $APP_INFO | jq -r '.min_sdk_version')" >> $GITHUB_OUTPUT
          echo "target_sdk=$(echo $APP_INFO | jq -r '.target_sdk_version')" >> $GITHUB_OUTPUT
          
          echo "whats_new<<EOF" >> $GITHUB_OUTPUT
          jq -r '.whats_new' app_info.json >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Patch APK with apk-mitm
        id: patch
        run: |
          APK_FILE="${{ steps.download.outputs.file }}"
          PATCHED_FILE="${APK_FILE%.apk}-patched.apk"

          apk-mitm --apktool "$APKTOOL_JAR" "$APK_FILE" || true

          if [ -f "$PATCHED_FILE" ]; then
            echo "patched_file=$PATCHED_FILE" >> $GITHUB_OUTPUT
            echo "✅ patched APK готов: $PATCHED_FILE"
          else
            echo "::warning::apk-mitm не собрал patched APK — релиз пойдёт без него"
          fi
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "${{ steps.download.outputs.package }}-v${{ steps.download.outputs.version }}-rustore"
          name: "${{ steps.download.outputs.package }} v${{ steps.download.outputs.version }} (RuStore)"
          body: |
            📦 **APK дамп из RuStore**
            
            ### 📋 Информация о приложении
            - **Package:** `${{ steps.download.outputs.package }}`
            - **Version:** `${{ steps.download.outputs.version }}` (build `${{ steps.download.outputs.version_code }}`)
            - **Min SDK:** Android `${{ steps.download.outputs.min_sdk }}`
            - **Target SDK:** Android `${{ steps.download.outputs.target_sdk }}`
            
            ### ✨ Что нового
            ```
            ${{ steps.download.outputs.whats_new }}
            ```
            🔓 `*-patched.apk` — версия с отключённым SSL pinning
          files: |
            ${{ steps.download.outputs.file }}
            ${{ steps.patch.outputs.patched_file != '' && steps.patch.outputs.patched_file || '' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub блокирует цепочки workflows из релизов, созданных GITHUB_TOKEN
      # (защита от рекурсии). Поэтому parser.yml не триггерится автоматически
      # на release: published. Запускаем его явно через workflow_dispatch —
      # это исключение, и GITHUB_TOKEN здесь работает.
      - name: Trigger parser workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run parser.yml --repo "${{ github.repository }}"
