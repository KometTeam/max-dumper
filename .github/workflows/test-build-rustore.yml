name: Test patched build from RuStore

on:
  push:
    branches: [private-fingerprint]
    paths:
      - '.github/workflows/test-build-rustore.yml'
  workflow_dispatch:
    inputs:
      device_id:
        description: 'deviceId для нужной версии (пусто — случайные)'
        required: false
        type: string
      version:
        description: 'Минимальная ожидаемая версия (необязательно)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          sudo apt-get update
          sudo apt-get install -y apksigner zipalign
          npm install -g apk-mitm@1.3.0
          APKTOOL_VER="3.0.2"
          curl -fLsS --retry 3 "https://github.com/iBotPeaches/Apktool/releases/download/v${APKTOOL_VER}/apktool_${APKTOOL_VER}.jar" \
            -o "$RUNNER_TEMP/apktool.jar"
          echo "APKTOOL_JAR=$RUNNER_TEMP/apktool.jar" >> "$GITHUB_ENV"

      - name: Download original APK from RuStore
        env:
          DEVICE_ID: ${{ inputs.device_id }}
          EXPECT_VERSION: ${{ inputs.version }}
        run: |
          ARGS=()
          if [[ -n "$DEVICE_ID" ]]; then
            ARGS+=(--device-id "$DEVICE_ID")
          fi
          if [[ -n "$EXPECT_VERSION" ]]; then
            ARGS+=(--expect-version "$EXPECT_VERSION")
          fi
          python dumper.py ru.oneme.app --output-dir build/source "${ARGS[@]}"
          test -s build/source/ru.oneme.app.apk

      - name: Patch fingerprint and run apk-mitm
        env:
          FINGERPRINT_PATCH: ${{ secrets.FINGERPRINT_PATCH }}
        run: |
          mkdir -p build/artifacts
          bash patches/patch_apk.sh build/source/ru.oneme.app.apk build/artifacts/ru.oneme.app-patched.apk

      - name: Upload patched APK
        uses: actions/upload-artifact@v4
        with:
          name: max-rustore-patched-${{ github.run_number }}-${{ github.run_attempt }}
          path: build/artifacts/ru.oneme.app-patched.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
